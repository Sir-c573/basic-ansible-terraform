
- name: Configure web server
  hosts: webservers
  become: true

  vars:
    environment: staging
    managed_by: Ansible

  tasks:

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Start and enable Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy HTML page
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: "0644"

    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted